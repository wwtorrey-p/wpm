[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; CH340 UART port; the native USB port (COM3) re-enumerates during reset and breaks uploads.
upload_port = COM4
monitor_port = COM4
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
; Skips IDF's git-describe version lookup, which fails on a repo with no commits.
board_build.cmake_extra_args = -DPROJECT_VER=0.1.0
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<controller.cpp>
build_flags = -std=c++17
